<div class="downloads" data-name="{name}" data-title="{title}" data-windows="{windows}" data-linux="{linux}">
    <h2>Download it</h2>
    <div class="box">
        <div class="text">It also runs on its own, without a browser. Unzip the file for your system, keeping the two files in it together, then run "{name}.exe" on Windows or "{name}.x86_64" on Linux.</div>
        <a class="try_it_now" href="assets/zips/{name}_windows.zip">{title} for Windows (zip, {windows})</a>
        <a class="try_it_now" href="assets/zips/{name}_linux.zip">{title} for Linux (zip, {linux})</a>
    </div>
</div>
